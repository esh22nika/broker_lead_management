services:
  db:
    image: postgres:16-alpine
    container_name: blms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: blms
      POSTGRES_USER: ${DB_USERNAME:-blms_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d blms"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - blms-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ${REGISTRY_USER:-esh22nika}/blms-backend:${IMAGE_TAG:-latest}
    container_name: blms-backend-container
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/blms
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:-blms_user}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SERVER_PORT: 8081
      BLMS_DEMO_DATA: ${BLMS_DEMO_DATA:-false}
      BLMS_ADMIN_EMAIL: ${BLMS_ADMIN_EMAIL:-admin@blms.com}
      BLMS_ADMIN_PASSWORD: ${BLMS_ADMIN_PASSWORD:-}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
    ports:
      - "127.0.0.1:8081:8081"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - blms-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: ${REGISTRY_USER:-esh22nika}/blms-frontend:${IMAGE_TAG:-latest}
    container_name: blms-frontend-container
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
      - "3000:80"
    networks:
      - blms-network

volumes:
  postgres_data:
    driver: local

networks:
  blms-network:
    driver: bridge
