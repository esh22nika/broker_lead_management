spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/blms}
spring.datasource.username=${DB_USERNAME:blms_user}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
server.port=8081
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
blms.demo-data=${BLMS_DEMO_DATA:false}
blms.bootstrap-admin-email=${BLMS_ADMIN_EMAIL:admin@blms.com}
blms.bootstrap-admin-password=${BLMS_ADMIN_PASSWORD:}
