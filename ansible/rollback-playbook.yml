---
# ====================================================================
# BLMS Automated Rollback and Recovery Playbook
# Week 14 Deliverable: Reliability Validation & Disaster Recovery
# ====================================================================

- name: Rollback BLMS to Previous Stable Release Baseline
  hosts: blms_servers, local
  become: true
  gather_facts: false

  vars:
    app_root_dir: /opt/blms
    rollback_version: "v1.2.0"
    registry_user: "esh22nika"
    backend_port: 8081

  tasks:

    # ------------------------------------------------------------------
    # 1. LOG ROLLBACK INITIATION
    # ------------------------------------------------------------------
    - name: Announce automated rollback procedure
      debug:
        msg: "Initiating emergency rollback to stable release baseline: {{ rollback_version }}"

    # ------------------------------------------------------------------
    # 2. GRACEFUL SERVICE STOP & REVERSION
    # ------------------------------------------------------------------
    - name: Stop current failing or unstable application containers
      command: docker compose -f {{ app_root_dir }}/deploy/docker-compose.yml stop backend frontend
      ignore_errors: true

    - name: Revert application container images to previous stable release tag
      command: >
        docker compose -f {{ app_root_dir }}/deploy/docker-compose.yml
        up -d --no-deps --force-recreate
        backend frontend
      environment:
        IMAGE_TAG: "{{ rollback_version }}"
      register: rollback_result

    # ------------------------------------------------------------------
    # 3. POST-ROLLBACK HEALTH VERIFICATION GATE
    # ------------------------------------------------------------------
    - name: Verify application recovery via backend health check
      uri:
        url: "http://localhost:{{ backend_port }}/api/v1/health"
        method: GET
        status_code: 200
        return_content: yes
      register: recovery_health
      until: recovery_health.status == 200 and ('UP' in recovery_health.content or 'healthy' in recovery_health.content)
      retries: 12
      delay: 3

    # ------------------------------------------------------------------
    # 4. ROLLBACK VERIFICATION SUMMARY
    # ------------------------------------------------------------------
    - name: Confirm recovery and baseline stability
      debug:
        msg:
          - "Rollback Status: COMPLETED SUCCESSFULLY"
          - "Current Active Baseline: {{ rollback_version }}"
          - "Service Health: REST API UP on port {{ backend_port }}"
          - "Zero Downtime Recovery Verified"
