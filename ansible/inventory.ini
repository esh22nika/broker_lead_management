# ==========================================
# BLMS Ansible Target Inventory
# ==========================================

[blms_servers]
# Target production server (can be AWS EC2, local VM, or bare metal)
app-server-01 ansible_host=192.168.1.100 ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/blms_key.pem

[local]
# Local provisioning target / development VM
localhost ansible_connection=local ansible_python_interpreter=/usr/bin/python3

[blms_servers:vars]
ansible_python_interpreter=/usr/bin/python3
app_root_dir=/opt/blms
app_user=blmsuser
app_group=blmsgroup
backend_port=8081
frontend_port=80
db_port=5432
